{% assign post_url = page.url | absolute_url %}
{% assign share_url = post_url | url_encode %}
<div class="post-share-row" role="group" aria-label="Share this post">
  <span class="post-share-caption">Share</span>
  <a class="post-share-icon" href="https://www.linkedin.com/sharing/share-offsite/?url={{ share_url }}" target="_blank" rel="noopener noreferrer" aria-label="Share on LinkedIn" title="Share on LinkedIn"><strong aria-hidden="true">in</strong></a>
  <a class="post-share-icon" href="https://twitter.com/intent/tweet?url={{ share_url }}&amp;text={{ page.title | url_encode }}" target="_blank" rel="noopener noreferrer" aria-label="Share on X" title="Share on X"><span aria-hidden="true">𝕏</span></a>
  <a class="post-share-icon" href="https://www.facebook.com/sharer/sharer.php?u={{ share_url }}" target="_blank" rel="noopener noreferrer" aria-label="Share on Facebook" title="Share on Facebook"><strong aria-hidden="true">f</strong></a>
  <button class="post-share-icon" type="button" data-copy-post-link="{{ post_url | escape }}" aria-label="Copy link" title="Copy link">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M10 13a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1m2 6a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1"/>
    </svg>
  </button>
  <span class="post-share-status" role="status"></span>
</div>
<script>
  (() => {
    const copyButton = document.querySelector('[data-copy-post-link]');
    const status = copyButton.parentElement.querySelector('[role="status"]');
    copyButton.addEventListener('click', async () => {
      const url = copyButton.dataset.copyPostLink;
      try {
        await navigator.clipboard.writeText(url);
        status.textContent = 'Link copied';
      } catch {
        status.textContent = 'Copy this link: ' + url;
      }
    });
  })();
</script>
